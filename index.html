<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#263e38"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./favicon.svg"><title>Simple Life</title><style>*{box-sizing:border-box}html,body,#app,#game{width:100%;height:100%;margin:0;overflow:hidden;background:#263e38}html,body{position:fixed;inset:0}.loading-screen{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#263e38;color:#efe4b7}.loading-screen__card{width:min(76vw,320px);padding:26px 24px 22px;border:4px solid #172c29;box-shadow:0 0 0 4px #587257;text-align:center;background:#314b3d;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.loading-screen__mark{font-size:20px;color:#d8b55b;text-shadow:2px 2px #172c29}.loading-screen__title{margin:7px 0 18px;font-size:20px;font-weight:800;letter-spacing:3px;text-shadow:2px 2px #172c29}.loading-screen__track{height:14px;padding:3px;border:2px solid #172c29;background:#1d3430}.loading-screen__fill{display:block;width:100%;height:100%;background:#d8b55b;transform:scaleX(0);transform-origin:left center}.loading-screen__status{margin-top:12px;font-size:12px;letter-spacing:.3px;color:#e1d7ad}</style></head><body><main id="app"><div id="game" aria-label="Simple Life pixel farming game"><div id="loading-screen" class="loading-screen" aria-live="polite"><div class="loading-screen__card"><div class="loading-screen__mark" aria-hidden="true">◆</div><div class="loading-screen__title">SIMPLE LIFE</div><div class="loading-screen__track" role="progressbar" aria-label="Loading Simple Life" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="loading-screen__fill"></span></div><div class="loading-screen__status">Loading your little world…</div></div></div></div></main><script type="module" src="/src/main.js"></script></body></html>

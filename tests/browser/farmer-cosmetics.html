<!doctype html><html><head><meta charset="utf-8"><title>Farmer wardrobe browser QA</title>
<style>body{margin:12px;background:#25332d;color:#f4edd9;font:14px system-ui}button,select{font:inherit;padding:7px;margin:3px}iframe{border:0;display:block;max-width:none}pre{white-space:pre-wrap}#stage{overflow:auto;max-height:850px}</style></head>
<body><h1>Farmer wardrobe browser QA</h1><p>Isolated local fixtures on port 4213. This page is excluded from production.</p>
<label>Viewport <select id="profile"><option value="desktop">Desktop 1280×720</option><option value="phone">Phone 390×844</option><option value="landscape">Landscape 640×360</option></select></label>
<button id="run">Run wardrobe checks</button><button id="show">Show idle with axe</button><button id="jump">Jump</button><pre id="status">Ready</pre><div id="stage"></div>
<script type="module">
import {newState} from '/src/systems/state.js';
import {GIRL_V2_HANDS,GIRL_CARRY_ANGLES} from '/src/data/revisedGirl.js';
import {FARM_PLOTS} from '/src/data/farms.js';
const carryProfile={hands:GIRL_V2_HANDS,angles:GIRL_CARRY_ANGLES};
import {farmerCarryPose} from '/src/systems/farmerCarry.js';
import {characterFrame} from '/src/systems/characterAnimation.js';
import {BOY_FARMER} from '/src/data/appearance.js';
import {VEGETATION} from '/src/data/vegetation.js';
import {walkable} from '/src/data/locations.js';
import {contextFor} from '/src/systems/context.js';
const status=document.querySelector('#status'),stage=document.querySelector('#stage');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(ok,message)=>{if(!ok)throw Error(message);};
const fixture=(tool='hand',action=null,character='girl')=>{
 const s=newState(character);Object.assign(s,{area:'home',position:{x:480,y:800},selected:tool,minute:600,money:311,starterSeedsClaimed:true,hasVisitedFarm:true,hasVisitedCity:true,forestTutorialComplete:true,nightWarningSeen:true});s.story.intro='seen';
 if(action){s.area='farm';s.position={x:696,y:152};s.ownsCopperCan=true;}
 if(action==='harvesting'){const bed=FARM_PLOTS[0];s.area='farm';s.position={x:bed.x,y:bed.y+16};s.plots[0]={crop:'tomato',growth:3,wateredDay:1,missedDays:0,lastEvaluatedDay:0};}
 if(action==='attack'){s.area='forest';s.position={x:936,y:4428};}
 if(action==='chopping')for(const n of VEGETATION.farm.trees){s.position={x:n.x,y:n.y-48};if(walkable('farm',s.position.x,s.position.y,12,false,s)&&contextFor(s)?.id===n.id)break;}
 return s;
};
let frame,win,records=[];
const snapshot=()=>{try{return win.__simpleLife?.snapshot();}catch{return null;}};
async function until(fn,message,ms=6000){const end=performance.now()+ms;while(performance.now()<end){const v=fn();if(v)return v;await sleep(20);}throw Error('Timed out: '+message);}
function key(code,down=true){const names={KeyA:'a',KeyD:'d',KeyW:'w',KeyS:'s',KeyE:'e',KeyK:'k',Space:' ',DigitTwo:'2',DigitFour:'4',DigitFive:'5',DigitSix:'6'};const codes={KeyA:65,KeyD:68,KeyW:87,KeyS:83,KeyE:69,KeyK:75,Space:32,DigitTwo:50,DigitFour:52,DigitFive:53,DigitSix:54};win.dispatchEvent(new win.KeyboardEvent(down?'keydown':'keyup',{key:names[code],code,keyCode:codes[code],which:codes[code],bubbles:true}));}
async function tap(code){key(code);await sleep(35);key(code,false);}
async function click(id){const c=await until(()=>snapshot()?.controls.find(c=>c.id===id&&!c.disabled),id);const canvas=win.document.querySelector('canvas'),rect=canvas.getBoundingClientRect();const x=rect.left+c.x+c.w/2,y=rect.top+c.y+c.h/2;
 for(const type of ['mousemove','mousedown','mouseup'])canvas.dispatchEvent(new win.MouseEvent(type,{clientX:x,clientY:y,button:0,buttons:type==='mousedown'?1:0,bubbles:true}));await sleep(240);}
async function start(state){
 assert(location.port==='4213','Run only on isolated port4213, preserving the normal game save.');
 frame?.remove();localStorage.setItem('simple-life.save.v1',JSON.stringify(state));
 frame=document.createElement('iframe');const profile=document.querySelector('#profile').value,phone=profile!=='desktop',landscape=profile==='landscape';frame.width=landscape?640:phone?390:1280;frame.height=landscape?360:phone?844:720;localStorage.setItem('simple-life.language.v1',phone?'mm':'en');frame.title='Isolated game';frame.src='/?qa';stage.append(frame);win=frame.contentWindow;
 await until(()=>snapshot()?.controls.length,'game boot');
 if(snapshot().controls.some(c=>c.id==='language-en'))await click(phone?'language-mm':'language-en');
 await click('Continue');await until(()=>snapshot()?.player&&!snapshot().paused,'playing');
}

async function sample(ms){const end=performance.now()+ms,values=[];while(performance.now()<end){values.push(snapshot());await sleep(10);}return values;}
const record=label=>{records.push(label);status.textContent='Running…\n'+records.join('\n');};
const assertFarmer=(s,character)=>{assert(s.state.character===character,'identity saved');assert(s.player.nativeWidth===64&&s.player.nativeHeight===64,'approved native rig');assert(s.player.texture===character||s.player.texture==='farmer-world-'+character,'same farmer texture');};
function cityFixture(character){const s=fixture('hand',null,character);s.area='city';s.position={x:1568,y:1040};s.money=1000;return s;}
async function wardrobe(){await click('customize');await click('customize-wardrobe');}
document.querySelector('#run').onclick=async()=>{try{
 records=[];
 for(const character of ['boy','girl']){
  await start(cityFixture(character));await tap('KeyE');await until(()=>snapshot()?.menu==='appearance','Nell wardrobe');
  for(let i=0;i<5;i++){
   if(i)await click('style-next');
   if(i>=2)await click('style-apply');
   assertFarmer(snapshot(),character);
  }
  assert(snapshot().state.money===640,'three outfit purchase total');record(character+' paid outfits keep chosen farmer');
  await click('style-tab-accessories');
  for(let i=0;i<3;i++){if(i)await click('style-next');await click('style-apply');assertFarmer(snapshot(),character);}
  assert(snapshot().state.money===470,'accessory costs exact');
  assert(JSON.stringify(snapshot().state.appearance.accessories)===JSON.stringify({hat:'straw',glasses:'round',bag:'canvas'}),'three independent slots');record(character+' buy and stack hat/glasses/bag');
  for(let i=0;i<4;i++)await click('style-turn');
  assert(!snapshot().controls.some(c=>c.id==='style-tab-hair'),'Nell has no hair tab');await click('style-close');
  const sol=structuredClone(snapshot().state);sol.position={x:472,y:1040};await start(sol);await tap('KeyE');await until(()=>snapshot()?.menu==='appearance','Sol stylist');
  for(let i=0;i<3;i++)await click('style-next');await click('style-apply');assert(snapshot().state.appearance.hair==='golden','hair colour applied');assert(snapshot().state.money===410,'hair cost');assertFarmer(snapshot(),character);await click('style-close');record(character+' hair colour preserves identity');
  const home=structuredClone(snapshot().state);home.area='home';home.position={x:480,y:800};home.selected='axe';await start(home);
  await wardrobe();await click('style-tab-accessories');await click('style-apply');assert(snapshot().state.appearance.accessories.hat===null,'remove owned hat');await click('style-apply');assert(snapshot().state.appearance.accessories.hat==='straw','wear owned hat');assert(snapshot().state.money===410,'free wardrobe');await click('style-close');record(character+' owned items free at home');
  for(const [direction,code]of [['left','KeyA'],['right','KeyD'],['up','KeyW'],['down','KeyS']]){
   key(code);const values=await sample(800);key(code,false);assert(new Set(values.filter(s=>s.player.direction===direction).map(s=>Number(s.player.frame)%8)).size===8,'eight running phases '+direction);assertFarmer(snapshot(),character);
  }
  await tap('Space');const jumps=await sample(650);assert(new Set(jumps.filter(s=>s.jump.active).map(s=>Number(s.player.frame)%8)).size===6,'jump six poses');record(character+' all four running directions and jump with layers');
  const carried=structuredClone(snapshot().state);for(const [tool,action]of [['shovel','digging'],['water','watering'],['axe','chopping'],['harvest','harvesting'],['axe','attack']]){
   const work=fixture(tool,action,character);work.appearance=carried.appearance;work.money=410;await start(work);await tap(action==='attack'?'KeyK':'KeyE');
   const values=await sample(850),active=values.filter(s=>s.player.action?.name===action);assert(active.length>0,action+' starts');assert(active.every(s=>!s.heldTool.visible),'combined action has no duplicate tool');assertFarmer(snapshot(),character);
  }
  record(character+' five work actions retain layers and hide separate tools');
  const reload=structuredClone(snapshot().state);await start(reload);assert(snapshot().state.money===410,'continue balance');assert(JSON.stringify(snapshot().state.appearance)===JSON.stringify(reload.appearance),'continue cosmetics');record(character+' save/continue');
 }
 status.textContent='PASS '+document.querySelector('#profile').value+'\n'+records.join('\n');
}catch(e){status.textContent='FAIL '+e.stack+'\nCompleted: '+records.join(', ');console.error(e);}};
document.querySelector('#show').textContent='Show dressed farmer';
document.querySelector('#show').onclick=async()=>{const s=fixture('axe');s.appearance={...s.appearance,outfit:'plum',hair:'chestnut',owned:['worker','gardener','plum'],ownedAccessories:['straw','round','canvas'],accessories:{hat:'straw',glasses:'round',bag:'canvas'}};await start(s);await wardrobe();await click('style-tab-accessories');status.textContent='Dressed female preview';};
document.querySelector('#jump').onclick=()=>tap('Space');
</script></body></html>

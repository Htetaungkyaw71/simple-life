<!doctype html><meta charset="utf-8"><title>Single 32×24 table review</title>
<style>body{margin:12px;background:#354038;color:#f4ecd6;font:14px system-ui}button,select{font:inherit;padding:7px;margin:3px}iframe{display:block;border:0}pre{white-space:pre-wrap}</style>
<h1>One native table review</h1><p>Isolated port4216 fixture; normal game saves remain untouched.</p>
<label>Viewport <select id="profile"><option value="desktop">Desktop 1280×720</option><option value="phone">Phone 390×844</option></select></label><button id="show">Show table</button><button id="check">Check table collision</button><pre id="status">Ready</pre><div id="stage"></div>
<script type="module">
import{newState}from'/src/systems/state.js';import{syncInterior}from'/src/data/locations.js';import{ROOM,FURNITURE,DINING_TABLE_ART}from'/src/data/interior.js';
const status=document.querySelector('#status'),stage=document.querySelector('#stage'),sleep=ms=>new Promise(r=>setTimeout(r,ms));let frame,win;
const snap=()=>win?.__simpleLife?.snapshot();const assert=(v,m)=>{if(!v)throw Error(m);};
async function until(fn,message){const end=performance.now()+15000;while(performance.now()<end){const value=fn();if(value)return value;await sleep(30);}throw Error('Timed out: '+message);}
async function click(id){const c=await until(()=>snap()?.controls.find(c=>c.id===id&&!c.disabled),id),canvas=win.document.querySelector('canvas'),r=canvas.getBoundingClientRect();for(const type of ['mousemove','mousedown','mouseup'])canvas.dispatchEvent(new win.MouseEvent(type,{clientX:r.left+c.x+c.w/2,clientY:r.top+c.y+c.h/2,button:0,buttons:type==='mousedown'?1:0,bubbles:true}));await sleep(180);}
function key(code,down){const n=code==='KeyA'?65:68;win.dispatchEvent(new win.KeyboardEvent(down?'keydown':'keyup',{key:code==='KeyA'?'a':'d',code,keyCode:n,which:n,bubbles:true}));}
async function start(){
 assert(location.port==='4216','isolated fixture only');const phone=document.querySelector('#profile').value==='phone',w=phone?390:1280,h=phone?844:720;syncInterior(w,h);const table=FURNITURE.find(([n])=>n==='home-table'),s=newState('girl');Object.assign(s,{area:'interior',position:{x:table[1]+108,y:table[2]+30},minute:600,starterSeedsClaimed:true,hasVisitedFarm:true,hasVisitedCity:true,forestTutorialComplete:true,nightWarningSeen:true});s.story.intro='seen';
 frame?.remove();localStorage.setItem('simple-life.save.v1',JSON.stringify(s));localStorage.setItem('simple-life.language.v1',phone?'mm':'en');frame=document.createElement('iframe');frame.width=w;frame.height=h;frame.title='Isolated game';frame.src='/?qa';stage.append(frame);win=frame.contentWindow;
 await until(()=>snap()?.controls.length,'boot');if(snap().controls.some(c=>c.id==='language-en'))await click(phone?'language-mm':'language-en');await click('Continue');await until(()=>snap()?.player&&!snap().paused,'playing');return table;
}
document.querySelector('#show').onclick=async()=>{try{await start();status.textContent='One 32×24 table, rendered at 2× native scale inside the house.';}catch(e){status.textContent='FAIL '+e.stack;}};
document.querySelector('#check').onclick=async()=>{try{const table=await start();assert(DINING_TABLE_ART.frame==='table-native-review','single sample frame');const before=snap().state.position.x;key('KeyA',true);await sleep(700);key('KeyA',false);await sleep(100);const blocked=snap().state.position.x;assert(blocked>=table[1]+60&&blocked<before-8,'table blocks at its visible footprint '+JSON.stringify({table,before,blocked}));key('KeyD',true);await sleep(300);key('KeyD',false);await sleep(100);assert(snap().state.position.x>blocked+8,'open ground beside table');status.textContent='PASS '+document.querySelector('#profile').value+'\nOne interior table uses the 32×24 local sprite\nWalking through is blocked; open ground beside it works';}catch(e){key('KeyA',false);key('KeyD',false);status.textContent='FAIL '+e.stack;console.error(e);}};
</script>
